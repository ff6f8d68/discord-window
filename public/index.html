<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
    canvas {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      cursor: pointer;
      will-change: transform;
      transform: translateZ(0);
    }
  </style>
</head>
<body>

  <canvas id="viewport" width="1280" height="720"></canvas>

  <script>
    const canvas = document.getElementById('viewport');
    const ctx = canvas.getContext('2d', { alpha: false });

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    let latestImage = null;
    let pendingImage = null;

    // Automatically forward the current URL query parameters (?site=https://youtube.com) to the WebSocket
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}${window.location.search}`;
    const ws = new WebSocket(wsUrl);

    ws.onmessage = (event) => {
      const img = new Image();
      img.onload = () => {
        pendingImage = img;
      };
      img.src = 'data:image/jpeg;base64,' + event.data;
    };

    // 60 FPS Render Loop
    function renderLoop() {
      if (pendingImage) {
        latestImage = pendingImage;
        pendingImage = null;
      }

      if (latestImage) {
        ctx.drawImage(latestImage, 0, 0, canvas.width, canvas.height);
      }

      requestAnimationFrame(renderLoop);
    }

    requestAnimationFrame(renderLoop);

    // Click relay
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      ws.send(JSON.stringify({ type: 'click', x, y }));
    });

    // Keyboard relay
    window.addEventListener('keydown', (e) => {
      ws.send(JSON.stringify({ type: 'keydown', key: e.key }));
    });
  </script>
</body>
</html>
